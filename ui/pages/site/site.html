<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="../../../resources/icons/brand/icon16.png" />
    <title>Site - Reeflect</title>
    <script src="../../shared/theme.js"></script>
    <link rel="stylesheet" href="../../shared/theme.css" />
    <link rel="stylesheet" href="../../shared/tour.css" />
    <link rel="stylesheet" href="./site.css" />
  </head>
  <body>
    <header>
      <div id="header-left">
        <a id="back-btn" tabindex="0" href="../dashboard/dashboard.html">
          <img src="../../../resources/icons/brand/logo.svg" alt="Reeflect">
        </a>
      </div>
      <div id="header-center">
        <img id="site-favicon" class="site-favicon" alt="" hidden>
        <div id="site-title">
          <span id="site-label" class="site-label"></span>
          <span id="site-id" class="text-meta"></span>
        </div>
      </div>
      <div id="header-right">
        <button id="limit-btn" class="btn" data-i18n="site_limitThisSite">Limit this site</button>
        <button id="delete-site-btn" class="square-btn" data-i18n-title="site_deleteAllData" title="Delete all data for this site">
          <span class="icon-mask icon-trash"></span>
        </button>
      </div>
    </header>

    <div id="charts-grid">
      <div id="stats-container" class="chart-container">
        <h2 class="chart-heading"><span data-i18n="rules_overview">Overview</span> <span id="overview-subheading" class="chart-subheading text-meta"></span></h2>
        <div id="stats-list" class="stats-list"></div>
        <div class="tooltip text-meta" id="peak-tooltip"></div>
      </div>

      <div id="subpages-container" class="chart-container">
        <h2 class="chart-heading" id="subpages-heading"><span data-i18n="site_pageActivity">Page activity</span>
          <label id="hide-brief-subpages-label" class="table-filter text-meta">
            <input type="checkbox" id="hide-brief-subpages-toggle" checked> <span data-i18n="dashboard_hideBrief">Hide brief (&lt;1m)</span>
          </label>
        </h2>
        <div id="subpage-search-wrap" class="input-wrap">
          <input type="search" id="subpage-search" class="text-input" data-i18n-placeholder="site_searchPagesPlaceholder" placeholder="Search pages…" autocomplete="off">
          <button id="subpage-search-clear" class="icon-btn input-clear" data-i18n-aria="common_clearSearch" aria-label="Clear search" hidden>&times;</button>
        </div>
        <div id="subpages-controls">
          <span class="text-meta" data-i18n="site_depth">Depth</span>
          <div id="depth-toggle" class="seg-control"></div>
          <div id="sort-toggle" class="seg-control" role="radiogroup">
            <button id="sort-time-btn" class="seg-btn active" role="radio" aria-checked="true" data-i18n="site_sortTime">Time</button>
            <button id="sort-visits-btn" class="seg-btn" role="radio" aria-checked="false" data-i18n="site_sortVisits">Visits</button>
          </div>
        </div>
        <ol id="subpages-list"></ol>
        <p id="subpages-empty" class="text-meta" style="display:none" data-i18n="site_noPagesMatch">No pages match your search.</p>
        <div id="subpages-footer" class="table-footer">
          <span id="subpages-count" class="text-meta"></span>
          <label id="strip-params-label" class="table-filter text-meta">
            <input type="checkbox" id="strip-params-toggle" checked> <span data-i18n="site_ignoreUrlParams">Ignore URL params</span>
          </label>
        </div>
      </div>
    </div>

    <div id="drill-view" style="display:none"></div>

    <script type="module" src="./site.js"></script>
  </body>
</html>
