<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="../../../resources/icons/brand/icon16.png" />
    <title>Dashboard - Reeflect</title>
    <script src="../../shared/theme.js"></script>
    <link rel="stylesheet" href="../../shared/theme.css" />
    <link rel="stylesheet" href="../../shared/syncStrip.css" />
    <script type="module" src="../../shared/syncStrip.js"></script>
    <script type="module" src="../../shared/bottomNav.js"></script>
    <link rel="stylesheet" href="../../shared/tour.css" />
    <link rel="stylesheet" href="../../shared/changelog.css" />
    <link rel="stylesheet" href="./dashboard.css" />
  </head>
  <body>
    <header>
      <div id="header-left">
        <div id="brand">
          <img id="brand-logo" src="../../../resources/icons/brand/logo.svg" alt="Reeflect" />
          <span class="brand-word">Reef<span>lect</span></span>
        </div>
        <button id="tour-btn" class="square-btn" data-i18n-title="dashboard_tourBtn" title="Take the tour">?</button>
      </div>
      <div id="header-center"></div>
      <div id="header-right">
        <button id="rules-btn" class="btn" type="button" data-i18n="dashboard_rulesBtn">Manage rules</button>
        <button id="settings-btn" class="square-btn" data-i18n-title="dashboard_settingsBtn" title="Settings">
          <span class="icon-mask icon-gear"></span>
        </button>
      </div>
    </header>

    <div id="changelog-subheader" hidden>
      <button id="changelog-version-btn" type="button" class="link-btn"></button>
      <button id="changelog-dismiss-btn" class="icon-btn" data-i18n-title="changelog_closeBanner" title="Dismiss" data-i18n-aria="changelog_closeBanner" aria-label="Dismiss">&times;</button>
    </div>

    <div id="dashboard-grid">
      <div class="chart-container" id="overview-container">
        <h2 class="chart-heading"><span data-i18n="rules_overview">Overview</span> <span id="overview-subheading" class="chart-subheading text-meta"></span>
        <button id="timeline-link" class="link-btn" style="margin-left:auto;font-size:var(--font-base);text-transform:none" data-i18n="dashboard_viewTimeline">View timeline →</button></h2>
        <div id="overview-stats" class="stats-list">
          <div class="stat-item"><span id="overview-sites-label" class="stat-label" data-i18n="popup_statsSites">Sites</span><span id="overview-sites" class="stat-value">—</span></div>
          <div class="stat-item"><span id="overview-vs-label" class="stat-label" data-i18n="popup_statsVsAvg">vs 7d avg</span><span id="overview-vs" class="stat-value">—</span></div>
          <div class="stat-item"><span id="overview-peak-hour-label" class="stat-label" data-i18n="popup_statsPeakHour">Peak hour</span><span id="overview-peak-hour" class="stat-value">—</span></div>
          <div class="stat-item"><span id="overview-first-browse-label" class="stat-label" data-i18n="popup_statsFirstBrowse">First browse</span><span id="overview-first-browse" class="stat-value">—</span></div>
          <div class="stat-item"><span id="overview-visits-label" class="stat-label" data-i18n="popup_statsTabVisits">Tab visits</span><span id="overview-visits" class="stat-value">—</span></div>
          <div class="stat-item"><span id="overview-idle-label" class="stat-label" data-i18n="popup_statsIdle">Idle</span><span id="overview-idle" class="stat-value">—</span></div>
        </div>
      </div>

      <div id="dashboard-charts-col">
        <div class="chart-container" id="top-chart-container">
          <h2 class="chart-heading"><span data-i18n="dashboard_top5">Top 5 sites</span> <span id="top-subheading" class="chart-subheading text-meta"></span></h2>
          <svg id="top-chart" class="chart-svg"></svg>
          <div class="tooltip text-meta" id="top-tooltip"></div>
          <p id="top-not-relevant" class="text-meta" style="display:none"></p>
        </div>

        <div class="chart-container" id="hourly-chart-container">
          <h2 class="chart-heading">
            <span data-i18n="dashboard_avgPerHour">Average per clock hour</span>
            <span id="hourly-subheading" class="chart-subheading text-meta"></span>
          </h2>
          <svg id="hourly-chart" class="chart-svg"></svg>
          <div class="tooltip text-meta" id="hourly-tooltip"></div>
          <p id="hourly-not-relevant" class="text-meta" style="display:none"></p>
        </div>
      </div>

      <div id="dashboard-table-col" class="chart-container">
        <h2 class="chart-heading" id="dashboard-table-heading">
          <span data-i18n="dashboard_allSites">All browsed sites</span>
          <label id="hide-brief-label" class="table-filter text-meta"><input type="checkbox" id="hide-brief-toggle" checked> <span data-i18n="dashboard_hideBrief">Hide brief (&lt;1m)</span></label>
        </h2>
        <div id="site-search-wrap" class="input-wrap">
          <input type="search" id="site-search" class="text-input" data-i18n-placeholder="dashboard_searchPlaceholder" placeholder="Search sites…" autocomplete="off">
          <button id="site-search-clear" class="icon-btn input-clear" data-i18n-aria="common_clearSearch" aria-label="Clear search" hidden>&times;</button>
        </div>
        <table id="dashboard-table" class="data-table data-table--scroll">
          <thead>
            <tr>
              <th id="th-name" tabindex="0" role="button" data-i18n="dashboard_col_name">Site</th>
              <th id="th-time" tabindex="0" role="button" data-i18n="dashboard_col_time">Active time</th>
              <th id="th-audio" tabindex="0" role="button" data-i18n="dashboard_col_audio">Audio playback</th>
              <th id="th-visits" tabindex="0" role="button" data-i18n="dashboard_col_visits">Visits</th>
            </tr>
          </thead>
          <tbody id="dashboard-body"></tbody>
        </table>
        <p id="empty-msg" class="empty-msg text-meta" data-i18n="dashboard_noData">No data for this period.</p>
        <div id="dashboard-footer" class="table-footer">
          <span id="entries-count" class="text-meta"></span>
          <div id="dashboard-footer-toggles">
            <label id="group-label" class="table-filter text-meta"><input type="checkbox" id="group-toggle"> <span data-i18n="dashboard_groupSubdomains">Group subdomains</span></label>
            <label id="merge-label" class="table-filter text-meta"><input type="checkbox" id="merge-toggle"> <span data-i18n="dashboard_mergeByName">Merge by name</span></label>
          </div>
        </div>
      </div>
    </div>

    <div id="notification" role="status" hidden></div>

    <script type="module" src="./dashboard.js"></script>
  </body>
</html>
